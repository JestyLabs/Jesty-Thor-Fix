<svg xmlns="http://www.w3.org/2000/svg" width="920" height="424" viewBox="0 0 920 424" role="img" aria-labelledby="title desc">
  <title id="title">AYN Thor v1.7.1: photographed battery-draw values, with and without the two fixes</title>
  <desc id="desc">Straightforward bar comparison using average on-screen values. Native TOP with fixes off: 1.86 W mean across five photos, range 1.43 to 2.27 W. True Bottom Screen Off and CPU Fix enabled: 0.97 W mean across four photos, range 0.95 to 0.98 W. These are photographs of app readouts, not a controlled battery-life study.</desc>
  <rect x="1" y="1" width="918" height="422" rx="22" fill="#111421" stroke="#30354D" stroke-width="2"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="42" y="56" fill="#F7F7FB" font-size="26" font-weight="700">BATTERY DRAW: WHAT THE APP SHOWED</text>
    <text x="42" y="86" fill="#AFB6CF" font-size="17">Average on-screen readings from 9 photos in TOP mode</text>
    <text x="42" y="139" fill="#F5C95D" font-size="20" font-weight="700">AYN NATIVE TOP · FIXES OFF</text>
    <text x="42" y="165" fill="#AFB6CF" font-size="16">5 photos  ·  readings from 1.43 to 2.27 W</text>
    <rect x="42" y="181" width="660" height="36" rx="12" fill="#2A2D41"/>
    <rect x="42" y="181" width="490.5" height="36" rx="12" fill="#F5C95D"/>
    <text x="736" y="211" fill="#F5C95D" font-size="29" font-weight="700">1.86 W</text>
    <text x="42" y="270" fill="#AC8DFC" font-size="20" font-weight="700">TRUE OFF + CPU FIX ON</text>
    <text x="42" y="296" fill="#AFB6CF" font-size="16">4 photos  ·  readings from 0.95 to 0.98 W</text>
    <rect x="42" y="312" width="660" height="36" rx="12" fill="#2A2D41"/>
    <rect x="42" y="312" width="255.4" height="36" rx="12" fill="#AC8DFC"/>
    <text x="736" y="342" fill="#AC8DFC" font-size="29" font-weight="700">0.97 W</text>
    <path d="M42 380H878" stroke="#30354D" stroke-width="1"/>
    <text x="42" y="405" fill="#AFB6CF" font-size="15">Both fixes differ between groups · photo averages, not a battery-life test</text>
  </g>
</svg>