<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img"><title>High-performance CPU frequency in native TOP and real screen-off mode</title><desc>Native TOP 2.707 GHz average, true bottom screen off 1.654 GHz average. High-performance cluster samples near maximum were 75 out of 75 natively and zero out of 45 with real screen-off.</desc><rect x="1" y="1" width="918" height="368" rx="22" fill="#111421" stroke="#30354D" stroke-width="2"/><text x="44" y="61" fill="#F7F7FB" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">CPU CLOCKS: NO LONGER STUCK NEAR MAX</text><text x="44" y="97" fill="#ABB2CD" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Average high-performance CPU speed while using TOP mode</text><text x="44" y="144" fill="#F7F7FB" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">Native TOP</text><rect x="44" y="158" width="660" height="30" rx="12" fill="#292C40"/><rect x="44" y="158" width="596" height="30" rx="12" fill="#F5C95D"/><text x="731" y="182" fill="#F5C95D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">2.71 GHz</text><text x="44" y="231" fill="#F7F7FB" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">True Bottom Screen Off</text><rect x="44" y="245" width="660" height="30" rx="12" fill="#292C40"/><rect x="44" y="245" width="364" height="30" rx="12" fill="#A78BFA"/><text x="731" y="269" fill="#A78BFA" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">1.65 GHz</text><text x="44" y="339" fill="#ABB2CD" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">Near-maximum CPU samples: 75/75 native → 0/45 with true screen-off.</text></svg>
