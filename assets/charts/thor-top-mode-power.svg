<svg xmlns="http://www.w3.org/2000/svg" width="920" height="355" viewBox="0 0 920 355" role="img"><title>System power proxy: native TOP versus True Bottom Screen Off</title><desc>Native TOP around 2.03 watts; True Bottom Screen Off around 1.24 watts. 39 percent lower measured proxy. Short A/B/A test, not a battery-life estimate.</desc><rect x="1" y="1" width="918" height="353" rx="22" fill="#111421" stroke="#30354D" stroke-width="2"/><text x="44" y="61" fill="#F7F7FB" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">BOTTOM SCREEN: REAL POWER-OFF VS NATIVE TOP</text><text x="44" y="97" fill="#ABB2CD" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Estimated system power in a controlled real-device test</text><rect x="716" y="36" width="164" height="43" rx="21" fill="#2E2342"/><text x="733" y="65" fill="#F5C95D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">39% LOWER*</text><text x="44" y="142" fill="#F7F7FB" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">Native TOP (bottom screen still active)</text><rect x="44" y="156" width="660" height="30" rx="12" fill="#292C40"/><rect x="44" y="156" width="595" height="30" rx="12" fill="#F5C95D"/><text x="731" y="180" fill="#F5C95D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">2.03 W</text><text x="44" y="227" fill="#F7F7FB" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600">True Bottom Screen Off</text><rect x="44" y="241" width="660" height="30" rx="12" fill="#292C40"/><rect x="44" y="241" width="363" height="30" rx="12" fill="#A78BFA"/><text x="731" y="265" fill="#A78BFA" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">1.24 W</text><text x="44" y="324" fill="#ABB2CD" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500">* Hardware power proxy only; not a claim of 39% longer battery life.</text></svg>
