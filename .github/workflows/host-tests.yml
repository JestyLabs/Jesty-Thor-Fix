name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_main_candidate:
        description: Explicit protected signing of this main CI build (not the frozen pair)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  APKTOOL_VERSION: '3.0.3'
  APKTOOL_SHA256: 'DBF930B076C6B9BE08D57C449CACEFC3BDD6B71EBD59B3066FC0E1F5B14F9423'
  EXPECTED_SIGNER_SHA256: '727D4850779BED1E51018108E13BC399D4DA38CFC68F4F7504120AD5E2DAD6FC'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.app.outputs.version }}
      version_code: ${{ steps.app.outputs.version_code }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify public repository text
        shell: pwsh
        run: ./scripts/test-public-content.ps1

      - name: Verify engineering roadmap contract
        shell: pwsh
        run: ./scripts/test-engineering-roadmap.ps1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: pwsh
        run: |
          sdkmanager "platforms;android-34" "build-tools;35.0.0"

      - name: Download pinned apktool
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'apktool.jar'
          $url = "https://github.com/iBotPeaches/Apktool/releases/download/v$env:APKTOOL_VERSION/apktool_$env:APKTOOL_VERSION.jar"
          Invoke-WebRequest -Uri $url -OutFile $jar
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $jar).Hash.ToUpperInvariant()
          if ($actual -ne $env:APKTOOL_SHA256) {
              throw "apktool SHA-256 mismatch: $actual"
          }
          "APKTOOL_JAR=$jar" >> $env:GITHUB_ENV

      - name: Read app version
        id: app
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'apk/AndroidManifest.xml' -Raw
          $version = [regex]::Match($manifest, 'android:versionName="([^"]+)"').Groups[1].Value
          $versionCode = [regex]::Match($manifest, 'android:versionCode="([^"]+)"').Groups[1].Value
          if (-not $version -or -not $versionCode) {
              throw 'Could not read versionName/versionCode from AndroidManifest.xml'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "version_code=$versionCode" >> $env:GITHUB_OUTPUT

      - name: Boot, lid and IPC models
        shell: pwsh
        run: ./scripts/test-boot-lid.ps1

      - name: Display and CPU read-path regression models
        shell: pwsh
        run: ./scripts/test-display-cpu-read-paths.ps1

      - name: S1 real display coordinator characterization (host-only)
        shell: pwsh
        run: ./scripts/test-display-coordinator-host.ps1

      - name: Production display coordinator sleep and cancellation
        shell: pwsh
        run: ./scripts/test-display-wake-coordinator.ps1

      - name: Dashboard models
        shell: pwsh
        run: ./scripts/test-dashboard.ps1

      - name: Reboot activation and negative authorization controls
        shell: pwsh
        run: ./scripts/test-reboot-activation-host.ps1 -RunNegativeControls

      - name: Controlled updater lifecycle (host Android adapters)
        shell: pwsh
        run: ./scripts/test-updater-lifecycle-host.ps1

      - name: App diagnostics privacy and retention
        shell: pwsh
        run: ./scripts/test-app-diagnostics.ps1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: S1 authoritative watcher producer contract (host-only)
        shell: pwsh
        run: python ./tests/test-watcher-producer-contract.py

      - name: Native updater timeout evidence redaction (host-only)
        shell: pwsh
        run: python ./tests/test-updater-e2e-timeout.py

      - name: Passive energy analysis fixtures (host-only)
        shell: pwsh
        run: python ./scripts/test-thor-energy.py

      - name: Exact accepted release rejection cases
        shell: pwsh
        run: python ./scripts/test-accepted-stable80-release.py

      - name: Strict TLS fixture shutdown and framing
        shell: pwsh
        run: python ./scripts/test-transport-tls-shutdown.py --output "$env:RUNNER_TEMP/tls-shutdown-results"

      - name: Validate release workflow policy
        shell: pwsh
        run: ./scripts/test-release-policy.ps1

      - name: Validate frozen signing and encrypted delivery policy
        shell: pwsh
        run: ./scripts/test-approved-physical-signing-policy.ps1

      - name: Validate frozen stable80 signing and encrypted delivery policy
        shell: pwsh
        run: ./scripts/test-approved-stable80-signing-policy.ps1

      - name: Build unsigned APK
        shell: pwsh
        run: |
          ./build.ps1 -ArtifactBaseName "Jesty-Thor-Fix-${{ steps.app.outputs.version }}"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-build-v${{ steps.app.outputs.version }}-${{ github.sha }}
          path: dist/Jesty-Thor-Fix-${{ steps.app.outputs.version }}-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  sign_main_candidate:
    name: Sign main candidate
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.sign_main_candidate == true && github.ref == 'refs/heads/main' && github.actor == 'SirJesty' && github.triggering_actor == 'SirJesty'
    runs-on: windows-latest
    environment: thor-signing
    concurrency:
      group: thor-release-keystore-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify signing environment and authorized operator
        shell: pwsh
        env:
          ORIGINAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CALLER_EVENT: ${{ github.event_name }}
          MAIN_SIGNING_OPT_IN: ${{ inputs.sign_main_candidate }}
          SIGNING_ENV_READY: ${{ vars.THOR_SIGNING_ENV_READY }}
        run: |
          if ($env:CALLER_EVENT -cne 'workflow_dispatch' -or $env:MAIN_SIGNING_OPT_IN -cne 'true') {
              throw 'Main candidate signing requires an explicit manual opt-in; pushes never sign.'
          }
          if ($env:ORIGINAL_ACTOR -cne 'SirJesty' -or $env:TRIGGERING_ACTOR -cne 'SirJesty') {
              throw 'Only the designated release operator may sign production candidates'
          }
          if ($env:SIGNING_ENV_READY -cne 'true') {
              throw 'thor-signing environment is not activated: configure restricted main deployments, reviewer policy, environment-scoped secrets and THOR_SIGNING_ENV_READY=true'
          }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android signing tools
        shell: pwsh
        run: sdkmanager "build-tools;35.0.0"

      - name: Download exact same-run unsigned CI artifact
        uses: actions/download-artifact@v8
        with:
          name: unsigned-build-v${{ needs.build.outputs.version }}-${{ github.sha }}
          path: unsigned

      - name: Verify unsigned candidate before unlocking the signing key
        shell: pwsh
        run: |
          $apks = @(Get-ChildItem -LiteralPath 'unsigned' -Filter '*.apk' -File -Recurse)
          if ($apks.Count -ne 1 -or $apks[0].Name -ne 'Jesty-Thor-Fix-${{ needs.build.outputs.version }}-unsigned.apk') {
              throw 'Unexpected unsigned build artifact'
          }
          $zipalign = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\zipalign.exe'
          & $zipalign -c -v 4 $apks[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned APK zipalign verification failed' }
          $aapt = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\aapt.exe'
          $line = (& $aapt dump badging $apks[0].FullName 2>&1 | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $line -notmatch "^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'") {
              throw 'Could not inspect unsigned APK package/version'
          }
          if ($Matches[1] -ne 'com.thor.displaypowertest' -or
              $Matches[2] -ne '${{ needs.build.outputs.version_code }}' -or
              $Matches[3] -ne '${{ needs.build.outputs.version }}') {
              throw 'Unsigned APK identity differs from verified CI manifest'
          }
          "UNSIGNED_APK=$($apks[0].FullName)" >> $env:GITHUB_ENV

      - name: Prepare and sign approved main candidate
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          THOR_KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_B64) -or
              [string]::IsNullOrWhiteSpace($env:THOR_KEYSTORE_PASSWORD)) {
              throw 'Missing environment-scoped signing credentials'
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'thor-release.keystore'
          try {
              [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_B64))
              New-Item -ItemType Directory -Path dist -Force | Out-Null
              $signed = Join-Path (Resolve-Path dist) 'Jesty-Thor-Fix-${{ needs.build.outputs.version }}.apk'
              $apksigner = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\apksigner.bat'
              & $apksigner sign `
                --ks $keystore `
                --ks-key-alias 'thor-display-power-auto' `
                --ks-pass 'env:THOR_KEYSTORE_PASSWORD' `
                --key-pass 'env:THOR_KEYSTORE_PASSWORD' `
                --out $signed `
                $env:UNSIGNED_APK
              if ($LASTEXITCODE -ne 0) { throw 'APK signing failed' }
              "SIGNED_APK=$signed" >> $env:GITHUB_ENV
          } finally {
              if (Test-Path -LiteralPath $keystore) { Remove-Item -LiteralPath $keystore -Force }
          }

      - name: Verify signed candidate and write metadata
        shell: pwsh
        env:
          EXPECTED_SIGNER_SHA256: '727D4850779BED1E51018108E13BC399D4DA38CFC68F4F7504120AD5E2DAD6FC'
        run: |
          $apk = Get-Item -LiteralPath $env:SIGNED_APK
          $apksigner = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\apksigner.bat'
          $verify = (& $apksigner verify --verbose --print-certs $apk.FullName 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'apksigner verification failed' }
          $signer = [regex]::Match($verify, 'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})').Groups[1].Value.ToUpperInvariant()
          if ($verify -notmatch 'Number of signers:\s*1\b' -or $signer -ne $env:EXPECTED_SIGNER_SHA256) {
              throw 'Signed candidate certificate does not match the established release certificate'
          }
          $aapt = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\aapt.exe'
          $packageLine = (& $aapt dump badging $apk.FullName 2>&1 | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $packageLine -notmatch "^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'") {
              throw 'Could not read signed APK package/version'
          }
          if ($Matches[1] -ne 'com.thor.displaypowertest' -or
              $Matches[2] -ne '${{ needs.build.outputs.version_code }}' -or
              $Matches[3] -ne '${{ needs.build.outputs.version }}') {
              throw 'Signed APK package/version differs from unsigned CI artifact'
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $apk.FullName).Hash.ToUpperInvariant()
          $unsignedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:UNSIGNED_APK).Hash.ToUpperInvariant()
          $metadata = [ordered]@{
              version = '${{ needs.build.outputs.version }}'
              versionCode = '${{ needs.build.outputs.version_code }}'
              commit = '${{ github.sha }}'
              apk = $apk.Name
              sha256 = $hash
              signerSha256 = $env:EXPECTED_SIGNER_SHA256
              unsignedSha256 = $unsignedHash
              sourceRunId = '${{ github.run_id }}'
              sourceRunAttempt = '${{ github.run_attempt }}'
          }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath 'dist/candidate-metadata.json' -Encoding utf8
          "$hash  $($apk.Name)" | Set-Content -LiteralPath 'dist/candidate-sha256.txt' -Encoding ascii

      - name: Upload signed main candidate
        uses: actions/upload-artifact@v7
        with:
          name: signed-candidate-v${{ needs.build.outputs.version }}-${{ github.sha }}
          path: |
            dist/Jesty-Thor-Fix-${{ needs.build.outputs.version }}.apk
            dist/candidate-metadata.json
            dist/candidate-sha256.txt
          if-no-files-found: error
          retention-days: 30

  android_emulator_smoke:
    name: Android emulator lifecycle and installer sessions (no vendor bridge)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android test build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-34" "ndk;27.2.12479018"

      - name: Verify native process fixture admission and build
        run: |
          python3 tests/test_process_binding_guard.py
          python3 scripts/test-process-binding-android.py --sdk "$ANDROID_HOME" --build "$RUNNER_TEMP/process-binding" --build-only

      - name: Download exact unsigned APK from this CI run
        uses: actions/download-artifact@v8
        with:
          name: unsigned-build-v${{ needs.build.outputs.version }}-${{ github.sha }}
          path: emulator-input

      - name: Sign with disposable emulator-only key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -alias thor-emulator-test -keyalg RSA -keysize 2048 \
            -validity 7 -keystore "$RUNNER_TEMP/emulator-test.jks" \
            -storepass android -keypass android -dname "CN=Thor Emulator Test, OU=CI, O=JestyLabs"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/emulator-test.jks" \
            --ks-key-alias thor-emulator-test \
            --ks-pass pass:android --key-pass pass:android \
            --out emulator-input/emulator-test.apk \
            "emulator-input/Jesty-Thor-Fix-${{ needs.build.outputs.version }}-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose emulator-input/emulator-test.apk

      - name: Build isolated installer harness with disposable test key
        shell: bash
        run: |
          bash scripts/build-installer-harness.sh "$RUNNER_TEMP/emulator-test.jks" emulator-input/installer-ci-harness.apk

      - name: Build real updater Android fixtures with isolated disposable keys
        shell: bash
        run: |
          python3 scripts/test-updater-android-e2e.py \
            --sdk "$ANDROID_HOME" --java "$JAVA_HOME" \
            --build "$RUNNER_TEMP/updater-e2e-build" --build-only

      - name: Build real dashboard UI instrumentation with disposable key
        shell: bash
        run: |
          python3 scripts/test-dashboard-android-ui.py \
            --sdk "$ANDROID_HOME" --java "$JAVA_HOME" \
            --unsigned-apk "emulator-input/Jesty-Thor-Fix-${{ needs.build.outputs.version }}-unsigned.apk" \
            --build "$RUNNER_TEMP/dashboard-ui-build" --build-only

      - name: Enable KVM for emulator
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Build display wake coordinator fixture with synthetic panels
        run: |
          python3 scripts/test-display-wake-android.py --sdk "$ANDROID_HOME" --java "$JAVA_HOME" --build "$RUNNER_TEMP/display-wake-build" --build-only

      - name: Test Android lifecycle with no vendor Binder
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 33
          avd-name: pr67-ci-api33
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            # Fresh AVD immersive tutorial must not intercept the PackageInstaller UI.
            adb -s emulator-5554 shell settings put secure immersive_mode_confirmations confirmed
            test "$(adb -s emulator-5554 shell settings get secure immersive_mode_confirmations | tr -d '\r')" = confirmed
            bash scripts/test-android-emulator-smoke.sh emulator-input/emulator-test.apk "${{ needs.build.outputs.version }}"
            bash scripts/test-android-installer-session.sh emulator-input/emulator-test.apk emulator-input/installer-ci-harness.apk
            python3 scripts/test-updater-android-e2e.py --sdk "$ANDROID_HOME" --build "$RUNNER_TEMP/updater-e2e-build" --serial emulator-5554 --avd pr67-ci-api33 --output "$RUNNER_TEMP/updater-e2e-results"
            python3 scripts/test-updater-android-metadata.py --sdk "$ANDROID_HOME" --build "$RUNNER_TEMP/updater-e2e-build" --serial emulator-5554 --avd pr67-ci-api33 --output "$RUNNER_TEMP/updater-metadata-results" --implementation catalog
            python3 scripts/test-updater-android-transport.py --sdk "$ANDROID_HOME" --build "$RUNNER_TEMP/updater-e2e-build" --serial emulator-5554 --avd pr67-ci-api33 --output "$RUNNER_TEMP/updater-transport-results"
            python3 scripts/test-dashboard-android-ui.py --sdk "$ANDROID_HOME" --build "$RUNNER_TEMP/dashboard-ui-build" --serial emulator-5554 --avd pr67-ci-api33 --output "$RUNNER_TEMP/dashboard-ui-results"
            python3 scripts/test-display-wake-android.py --sdk "$ANDROID_HOME" --build "$RUNNER_TEMP/display-wake-build" --run-only --serial emulator-5554 --avd pr67-ci-api33 --output "$RUNNER_TEMP/display-wake-results"
            SOURCE_HEAD="${{ github.event.pull_request.head.sha || github.sha }}" python3 scripts/test-process-binding-android.py --sdk "$ANDROID_HOME" --build "$RUNNER_TEMP/process-binding" --serial emulator-5554 --avd pr67-ci-api33
