name: Sign test candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful pull-request CI run ID whose unsigned APK should be signed
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  EXPECTED_SIGNER_SHA256: '727D4850779BED1E51018108E13BC399D4DA38CFC68F4F7504120AD5E2DAD6FC'

jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        shell: pwsh
        run: sdkmanager "build-tools;35.0.0"

      - name: Validate source CI run
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if ($env:RUN_ID -notmatch '^[0-9]+$') {
              throw 'candidate_run_id must be numeric'
          }

          $run = gh api "repos/${{ github.repository }}/actions/runs/$env:RUN_ID" | ConvertFrom-Json
          if ($run.name -ne 'CI') {
              throw "Source run is not the CI workflow: $($run.name)"
          }
          if ($run.event -ne 'pull_request') {
              throw "Source run must be a pull_request run, got: $($run.event)"
          }
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') {
              throw "Source run is not a completed success: $($run.status)/$($run.conclusion)"
          }
          if ($run.head_repository.full_name -ne '${{ github.repository }}') {
              throw "Refusing to sign an artifact from another repository: $($run.head_repository.full_name)"
          }
          if ($run.head_sha -notmatch '^[0-9a-f]{40}$') {
              throw 'Source run did not expose a valid commit SHA'
          }

          "source_sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
          "source_branch=$($run.head_branch)" >> $env:GITHUB_OUTPUT

      - name: Locate unsigned artifact
        id: artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          # pull_request workflows build GitHub's synthetic merge ref, while
          # actions/runs exposes the PR head as run.head_sha. Therefore the
          # artifact's embedded CI SHA is validated from the artifact that
          # belongs to this exact run, rather than compared to run.head_sha.
          $payload = gh api "repos/${{ github.repository }}/actions/runs/$env:RUN_ID/artifacts?per_page=100" | ConvertFrom-Json
          $matches = @($payload.artifacts | Where-Object {
              -not $_.expired -and
              $_.name -match '^unsigned-build-v.+-[0-9a-f]{40}$'
          })
          if ($matches.Count -ne 1) {
              throw "Expected exactly one unsigned CI artifact in the selected run; found $($matches.Count)"
          }
          $artifactName = $matches[0].name
          if ($artifactName -notmatch '-([0-9a-f]{40})$') {
              throw 'Unsigned artifact did not expose its CI build SHA'
          }
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "ci_build_sha=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Download exact unsigned artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact_name }}
        run: |
          New-Item -ItemType Directory -Path input | Out-Null
          gh run download $env:RUN_ID `
            --repo '${{ github.repository }}' `
            --name $env:ARTIFACT_NAME `
            --dir input

          $apks = @(Get-ChildItem -LiteralPath input -Filter '*.apk' -File -Recurse)
          if ($apks.Count -ne 1) {
              throw "Expected exactly one APK in artifact; found $($apks.Count)"
          }
          "UNSIGNED_APK=$($apks[0].FullName)" >> $env:GITHUB_ENV

      - name: Inspect unsigned APK
        id: app
        shell: pwsh
        run: |
          $aapt = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\aapt.exe'
          $badging = @(& $aapt dump badging $env:UNSIGNED_APK 2>&1)
          $aaptExit = $LASTEXITCODE
          $line = @($badging | Where-Object { $_ -match '^package:\s' } | Select-Object -First 1)

          if ($aaptExit -ne 0 -or $line.Count -ne 1) {
              $badging | ForEach-Object { Write-Host $_ }
              throw 'Could not read APK package/version'
          }

          $packageMatch = [regex]::Match(
              [string]$line[0],
              "^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'"
          )
          if (-not $packageMatch.Success) {
              $badging | ForEach-Object { Write-Host $_ }
              throw 'Could not parse APK package/version'
          }

          $packageName = $packageMatch.Groups[1].Value
          $versionCode = $packageMatch.Groups[2].Value
          $versionName = $packageMatch.Groups[3].Value

          if ($packageName -ne 'com.thor.displaypowertest') {
              throw "Unexpected package: $packageName"
          }

          "version=$versionName" >> $env:GITHUB_OUTPUT
          "version_code=$versionCode" >> $env:GITHUB_OUTPUT
          "unsigned_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $env:UNSIGNED_APK).Hash.ToUpperInvariant())" >> $env:GITHUB_OUTPUT

      - name: Prepare signing material
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.THOR_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)) {
              throw 'Missing repository secret THOR_KEYSTORE_B64'
          }
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_PASSWORD)) {
              throw 'Missing repository secret THOR_KEYSTORE_PASSWORD'
          }

          $keystore = Join-Path $env:RUNNER_TEMP 'thor-release.keystore'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_B64))
          "JESTY_KEYSTORE=$keystore" >> $env:GITHUB_ENV

      - name: Sign exact test APK
        shell: pwsh
        env:
          THOR_KEYSTORE_PASSWORD: ${{ secrets.THOR_KEYSTORE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path output | Out-Null
          $signed = Join-Path (Resolve-Path output) "Jesty-Thor-Fix-${{ steps.app.outputs.version }}-test-${{ steps.artifact.outputs.ci_build_sha }}.apk"
          $apksigner = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\apksigner.bat'

          & $apksigner sign `
            --ks $env:JESTY_KEYSTORE `
            --ks-key-alias 'thor-display-power-auto' `
            --ks-pass 'env:THOR_KEYSTORE_PASSWORD' `
            --key-pass 'env:THOR_KEYSTORE_PASSWORD' `
            --out $signed `
            $env:UNSIGNED_APK
          if ($LASTEXITCODE -ne 0) { throw 'apksigner sign failed' }

          "SIGNED_APK=$signed" >> $env:GITHUB_ENV

      - name: Verify signed test candidate
        shell: pwsh
        run: |
          $apksigner = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\apksigner.bat'
          $verify = (& $apksigner verify --verbose --print-certs $env:SIGNED_APK 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'apksigner verification failed' }

          $signer = [regex]::Match(
              $verify,
              'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})'
          ).Groups[1].Value.ToUpperInvariant()

          if ($verify -notmatch 'Number of signers:\s*1\b' -or
              $signer -ne $env:EXPECTED_SIGNER_SHA256) {
              throw 'Signed test candidate certificate does not match the established release certificate'
          }

          $aapt = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\35.0.0\aapt.exe'
          $badging = @(& $aapt dump badging $env:SIGNED_APK 2>&1)
          $aaptExit = $LASTEXITCODE
          $line = @($badging | Where-Object { $_ -match '^package:\s' } | Select-Object -First 1)
          if ($aaptExit -ne 0 -or $line.Count -ne 1) {
              $badging | ForEach-Object { Write-Host $_ }
              throw 'Could not read signed APK package/version'
          }

          $packageMatch = [regex]::Match(
              [string]$line[0],
              "^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'"
          )
          if (-not $packageMatch.Success) {
              $badging | ForEach-Object { Write-Host $_ }
              throw 'Could not parse signed APK package/version'
          }

          if ($packageMatch.Groups[1].Value -ne 'com.thor.displaypowertest' -or
              $packageMatch.Groups[2].Value -ne '${{ steps.app.outputs.version_code }}' -or
              $packageMatch.Groups[3].Value -ne '${{ steps.app.outputs.version }}') {
              throw 'Signed APK package/version differs from the unsigned CI artifact'
          }

          $signedSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:SIGNED_APK).Hash.ToUpperInvariant()
          $metadata = [ordered]@{
              kind = 'signed-test-candidate'
              sourceRunId = '${{ inputs.candidate_run_id }}'
              sourceHeadCommit = '${{ steps.source.outputs.source_sha }}'
              ciBuildCommit = '${{ steps.artifact.outputs.ci_build_sha }}'
              sourceBranch = '${{ steps.source.outputs.source_branch }}'
              sourceArtifact = '${{ steps.artifact.outputs.artifact_name }}'
              package = 'com.thor.displaypowertest'
              version = '${{ steps.app.outputs.version }}'
              versionCode = '${{ steps.app.outputs.version_code }}'
              unsignedSha256 = '${{ steps.app.outputs.unsigned_sha256 }}'
              signedSha256 = $signedSha
              signerSha256 = $env:EXPECTED_SIGNER_SHA256
              apk = (Split-Path -Leaf $env:SIGNED_APK)
          }
          $metadata | ConvertTo-Json | Set-Content -LiteralPath output/test-candidate-metadata.json -Encoding utf8
          "$signedSha  $(Split-Path -Leaf $env:SIGNED_APK)" |
              Set-Content -LiteralPath output/test-candidate-sha256.txt -Encoding ascii

      - name: Upload signed test candidate
        uses: actions/upload-artifact@v4
        with:
          name: signed-test-candidate-v${{ steps.app.outputs.version }}-${{ steps.artifact.outputs.ci_build_sha }}
          path: |
            ${{ env.SIGNED_APK }}
            output/test-candidate-metadata.json
            output/test-candidate-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        shell: pwsh
        run: |
          if ($env:JESTY_KEYSTORE -and (Test-Path -LiteralPath $env:JESTY_KEYSTORE)) {
              Remove-Item -LiteralPath $env:JESTY_KEYSTORE -Force
          }
