name: Bottom wake flash research checks

on:
  pull_request:
    paths:
      - 'scripts/analyze-bottom-wake-flash.py'
      - 'tests/test_bottom_wake_flash.py'
      - 'research/wake/**'
      - 'docs/BOTTOM-BRIGHT-FLASH-AFTER-LID-WAKE-20261011.md'
      - '.github/workflows/bottom-wake-flash-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify-fixtures:
    name: Bottom wake offline analyzer fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Synthetic-only analyzer/privacy tests
        run: python -m unittest discover -s tests -p 'test_bottom_wake_flash.py' -v
      - name: Parser compilation
        run: python -m py_compile scripts/analyze-bottom-wake-flash.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Host-only awake-gate model regressions
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/wake-model-tests"
          javac -encoding UTF-8 -d "${RUNNER_TEMP}/wake-model-tests" \
            src/com/thor/displaypowertest/DisplayDecisionModel.java \
            research/wake/AutomaticBottomOnPolicy.java \
            research/wake/AutomaticBottomOnPolicyTest.java \
            research/wake/AutomaticBottomWakeRecoveryModel.java \
            research/wake/AutomaticBottomWakeRecoveryModelTest.java
          java -cp "${RUNNER_TEMP}/wake-model-tests" \
            com.thor.displaypowertest.AutomaticBottomOnPolicyTest
          java -cp "${RUNNER_TEMP}/wake-model-tests" \
            com.thor.displaypowertest.AutomaticBottomWakeRecoveryModelTest



# NEVER upload logcat, captured panel state, user-device evidence or
# test-input artifacts here. All fixtures are synthetic.
# The Java prototype is NOT imported or called by the production APK.
